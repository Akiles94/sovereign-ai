<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Firmantes — Sovereign AI</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0b0d10;
    --panel: #14171b;
    --border: #262a30;
    --text: #e8eaed;
    --muted: #9aa3ad;
    --accent: #4f8cff;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f7f8fa;
      --panel: #ffffff;
      --border: #e3e6ea;
      --text: #14171b;
      --muted: #5b6470;
      --accent: #2f6fed;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5;
  }
  main {
    max-width: 680px;
    margin: 0 auto;
    padding: 48px 20px 80px;
  }
  h1 {
    font-size: 1.6rem;
    margin: 0 0 8px;
  }
  p.lead {
    color: var(--muted);
    margin: 0 0 32px;
  }
  .counter {
    display: flex;
    align-items: baseline;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 24px;
    margin-bottom: 28px;
  }
  .counter strong {
    font-size: 2.2rem;
    color: var(--accent);
  }
  .counter span {
    color: var(--muted);
  }
  .cta {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    padding: 10px 18px;
    border-radius: 8px;
    font-weight: 600;
    margin-bottom: 36px;
  }
  ul#list {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  ul#list li {
    border-bottom: 1px solid var(--border);
    padding: 14px 0;
  }
  ul#list li a {
    color: var(--text);
    font-weight: 600;
    text-decoration: none;
  }
  ul#list li a:hover {
    color: var(--accent);
  }
  ul#list li .msg {
    display: block;
    color: var(--muted);
    font-size: 0.9rem;
    margin-top: 4px;
  }
  .empty, .error {
    color: var(--muted);
  }
</style>
</head>
<body>
<main>
  <h1>Firmantes de Sovereign AI</h1>
  <p class="lead">
    Personas que apoyan la iniciativa sin necesariamente aportar dinero.
    ¿Quieres unirte? <a href="https://github.com/akiles94/sovereign-ai/issues/new?template=sign-initiative.yml">Firma aquí</a>.
  </p>

  <div class="counter">
    <strong id="count">—</strong>
    <span>personas han firmado</span>
  </div>

  <a class="cta" href="https://github.com/akiles94/sovereign-ai/issues/new?template=sign-initiative.yml">Firmar la iniciativa</a>

  <ul id="list"></ul>
  <p id="status" class="empty"></p>
</main>

<script>
  async function render() {
    const countEl = document.getElementById("count");
    const listEl = document.getElementById("list");
    const statusEl = document.getElementById("status");

    try {
      const res = await fetch("data/signatories.json", { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();

      countEl.textContent = data.length;

      if (data.length === 0) {
        statusEl.textContent = "Todavía no hay firmas. ¡Sé el primero!";
        return;
      }

      const sorted = [...data].sort((a, b) => (b.signedAt || "").localeCompare(a.signedAt || ""));
      for (const entry of sorted) {
        const li = document.createElement("li");

        const a = document.createElement("a");
        a.href = entry.linkedin;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.textContent = entry.name;
        li.appendChild(a);

        if (entry.message) {
          const msg = document.createElement("span");
          msg.className = "msg";
          msg.textContent = entry.message;
          li.appendChild(msg);
        }

        listEl.appendChild(li);
      }
    } catch (err) {
      countEl.textContent = "—";
      statusEl.textContent = "No se pudo cargar la lista de firmantes.";
      statusEl.className = "error";
    }
  }

  render();
</script>
</body>
</html>
